<section class="p-12 box-border m-0 min-h-screen h-auto flex justify-center bg-linear-to-br from-indigo-600 to-indigo-300">
    <div class="shoppingitems border-2 w-9/12 bg-white rounded-lg shadow-lg">
        <h1 class="text-center m-5 text-3xl font-bold">Esta es tu lista de deseados</h1>
        
        <div class="p-4 border-t-2">
        @for (p of products(); track p.id) {
            <div class="border p-4 rounded-xl hover:shadow-lg transition-shadow bg-white mb-4">
                <img [src]="p.image" class="h-40 object-contain mb-4 rounded" alt="{{ p.name }}">
                
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="font-bold text-lg text-indigo-900">{{ p.name }}</h2>
                        <p class="text-sm text-gray-600 mb-1">{{ p.type }}</p>
                        <p class="font-bold text-xl text-gray-800">{{ p.price }} €</p>
                    </div>
                    
                    <div class="text-center">
                        <input type="checkbox" [id]="'star-' + p.id" class="star-checkbox sr-only peer" [checked]="p.wishlisted" (change)="toggleWishlist(p)" />
                        <label [attr.for]="'star-' + p.id" 
                               class="star cursor-pointer peer-focus:ring-2 peer-focus:ring-indigo-500 rounded inline-block mb-2" 
                               title="Quitar de la lista de deseos" 
                               aria-label="Quitar {{ p.name }} de deseados"></label>
                        
                        <div class="flex items-center justify-center bg-gray-50 rounded-full p-1 border mt-1">
                            <button class="w-8 h-8 font-bold rounded-full hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors cursor-pointer"
                                aria-label="Quitar una unidad de {{ p.name }}"
                                (click)="removeFromCart(p)">-</button>
                                
                            <input type="text" readonly 
                                class="w-6 text-center font-semibold bg-transparent focus:outline-none cursor-auto"
                                aria-label="Cantidad de {{ p.name }}"
                                [value]="p.quantity">
                                
                            <button class="w-8 h-8 font-bold rounded-full hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors cursor-pointer"
                                aria-label="Añadir una unidad de {{ p.name }}"
                                (click)="addToCart(p)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        } @empty {
            <div class="text-center p-12 bg-white border-2 border-dashed border-indigo-200 rounded-xl shadow-sm">
                <p class="text-indigo-800 font-bold text-xl mb-2">Tu lista de deseados está vacía</p>
                <p class="text-md text-gray-500 mb-6">¡Marca la estrella en los productos que más te gusten para guardarlos aquí!</p>
                <a routerLink="/catalogo" class="inline-block px-6 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors cursor-pointer">
                    Explorar productos
                </a>
            </div>
        }
        </div>
    </div>
</section>
