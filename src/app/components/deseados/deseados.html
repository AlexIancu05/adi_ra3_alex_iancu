<section class="p-12 box-border m-0 min-h-screen h-auto flex justify-center bg-linear-to-br from-indigo-600 to-indigo-300">
    <div class="shoppingitems border-2 w-9/12 bg-white">
        <h1 class="text-center m-5 text-3xl font-bold">Esta es tu lista de deseados</h1>
        <div class="p-4 border-t-2">
        @for (p of products(); track p.id) {
        <div class="border p-4 rounded hover:shadow-md transition bg-white mb-4">
            <img [src]="p.image" class="h-40 object-contain mb-2 rounded">
            <div class="flex justify-between">
                <div>
                    <h2 class="font-bold">{{ p.name }}</h2>
                    <p class="text-sm text-gray-600">{{ p.type }}</p>
                    <p class="mt-1 font-semibold">{{ p.price }} €</p>
                </div>
                <div class="text-center mb-2">
                    <input type="checkbox" [id]="'star-' + p.id" class="star-checkbox" [checked]="p.wishlisted"
                        (change)="toggleWishlist(p)" />
                    <label [attr.for]="'star-' + p.id" class="star"></label>
                    <br>
                    <button class="border p-0.5 w-8 h-8 font-bold rounded-full cursor-pointer"
                        (click)="removeFromCart(p)">-</button>
                    <input type="text" readonly class="border w-5 text-center ml-2 mr-2 cursor-auto"
                        [value]="p.quantity">
                    <button class="border p-0.5 w-8 h-8 font-bold rounded-full cursor-pointer"
                        (click)="addToCart(p)">+</button>
                </div>
            </div>
        </div>
        }
        </div>
    </div>

</section>
